name: Deploy to Cloudflare
# Builds and deploys the Worker (app + API) from main using the repo secret CLOUDFLARE_API_TOKEN.
# Without the secret the job does nothing. Create the token in the Cloudflare dashboard (My Profile > API Tokens > "Edit Cloudflare Workers" template).
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: cloudflare-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '81358ab5a68048df5a07614d99f53204' }}
    steps:
      - name: Check for the token
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy."; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.gate.outputs.go == 'yes'
      - run: npm run build
        if: steps.gate.outputs.go == 'yes'
      - run: npx wrangler deploy
        if: steps.gate.outputs.go == 'yes'
