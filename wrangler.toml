name = "chess-openings"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chess-openings"
database_id = "REPLACE_WITH_YOUR_D1_ID" # from `npx wrangler d1 create chess-openings`
